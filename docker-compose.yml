services:
  bannedgmodservers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bannedgmodservers
    ports:
      - "3000:3000"
    volumes:
      - ./banned.html:/app/banned.html
      - ./server.js:/app/server.js
      - ./bans-data:/app/data
      - ./cache:/app/cache
    environment:
      - NODE_ENV=production
    restart: unless-stopped
